

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: qcser-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qcser_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qcser_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - qcser-network

  # PostgreSQL Test Database
  postgres-test:
    image: postgres:15-alpine
    container_name: qcser-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: qcser_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - qcser-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: qcser-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - qcser-network

  # Redis Test
  redis-test:
    image: redis:7-alpine
    container_name: qcser-redis-test
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    networks:
      - qcser-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: qcser-app
    restart: on-failure
    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=development
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=password
      - DATABASE_NAME=qcser_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - WATCHPACK_POLLING=true
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - qcser-network

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:
  redis_test_data:

networks:
  qcser-network:
    driver: bridge